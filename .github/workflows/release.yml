name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 先建好 draft release 并把 CHANGELOG 的对应段落写进去。
  # mygo -upload 对已存在的 release 不会再写 notes，所以这里必须自己带；
  # 串行建一次也能避免几个 build job 并发调 gh release create 造出重复 release。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create draft release with the changelog notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / {
              if (in_notes) exit
              h = $2
              gsub(/^\[/, "", h); sub(/\].*/, "", h); sub(/^v/, "", h)
              in_notes = (h == v); next
            }
            in_notes { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md 里没有 $version 的发布说明"; exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Gloss $GITHUB_REF_NAME" \
              --notes-file notes.md

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 只跑一个 job：mygo 的 DMG 名字不含架构（"<Name> <Version>.dmg"），
          # arm64 / amd64 并行会同名互撞，即 v0.1.0 那次上传 404 的原因。
          - platform: darwin/universal
            os: macos-latest
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: windows/amd64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check that the tag matches mygo.json
        run: |
          want="v$(jq -r .version mygo.json)"
          test "$GITHUB_REF_NAME" = "$want" || {
            echo "tag $GITHUB_REF_NAME 与 mygo.json 的 version $want 不一致"; exit 1; }

      # NSIS 只在 Windows 上自动下载，ubuntu runner 上必须自己装，否则没有
      # "Gloss Setup X.Y.Z.exe"，windows job 会以 "nothing to upload" 失败。
      - name: Install NSIS for the Windows installer
        if: matrix.platform == 'windows/amd64'
        run: sudo apt-get update && sudo apt-get install -y nsis

      # TCC 授权（屏幕录制、文件与文件夹、辅助功能）绑定在 App 的代码签名上。
      # ad-hoc 签名每次发版 cdhash 都会变，用户更新后旧授权匹配不上，只能重新
      # 授权；用同一张 Apple Development 证书签名后，designated requirement
      # 跨版本不变，授权就能一直沿用。
      - name: Import the macOS signing certificate
        if: matrix.platform == 'darwin/universal'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE" || { echo "缺少 MACOS_CERTIFICATE secret"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Apple Development: .*\)"/\1/p' | head -1)"
          test -n "$identity" || { echo "证书中没有 Apple Development 身份"; exit 1; }
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          sign=()
          if [ "${{ matrix.platform }}" = "darwin/universal" ]; then
            sign=(-sign "$MACOS_SIGNING_IDENTITY")
          fi
          go tool mygo build -platform "${{ matrix.platform }}" "${sign[@]}" -upload

      # Defender 的 ML 误报（Trojan:Script/Wacatac.C!ml 那类）咬的是**安装包**：
      # 未签名 + 每次发版全新哈希 + NSIS 单文件，正是它最先咬的画像。被拦住的
      # Windows 用户需要一条免安装的路，这份 zip 就是 —— 解压直接双击
      # Gloss.exe，不写注册表、不加开始菜单。
      #
      # 只收 exe 和它运行时要用的原生库，不 zip 整个 build/windows-amd64：
      # 那个目录里还躺着安装包、更新用的 tar.gz / 增量 / 清单和已经
      # go:embed 进二进制的 PNG，都不归便携包管（理由见 portable-zip.sh 顶上）。
      # v0.3.32 那一版把整个目录打进去了，30MB 里 21MB 没人用。
      #
      # 只加 zip、不动 gloss-<版本>-windows-amd64.tar.gz：客户端更新只按
      # update-windows-amd64.json 里的 URL 下载（还带 ed25519 签名校验），
      # 不会去 release 资产里按名字找包，多一个 zip 影响不到自动更新。
      - name: Upload the portable Windows ZIP
        if: matrix.platform == 'windows/amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version mygo.json)"
          zip="$RUNNER_TEMP/gloss-${version}-windows-amd64-portable.zip"
          sh scripts/portable-zip.sh "build/windows-amd64" "$zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice::便携包已上传：$(basename "$zip")（Defender 误报时的免安装绕过路径）"

      # 老版本 arm64 安装的更新 feed 是 update-darwin-arm64.json，通用包只产出
      # update-darwin-universal.json，所以补一次按架构构建（-skip-dmg 避免 DMG 同名冲突）。
      - name: Keep per-arch macOS update feeds
        if: matrix.platform == 'darwin/universal'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64 -skip-dmg -sign "$MACOS_SIGNING_IDENTITY" -upload
